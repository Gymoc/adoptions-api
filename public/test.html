<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <title>Adoptions API Tester</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; color: #222; line-height: 1.5; }
    h1 { margin-bottom: .25rem; }
    fieldset { border: 1px solid #ccc; border-radius: 8px; margin: 1rem 0; padding: 1rem; }
    legend { font-weight: 600; }
    label { font-weight: 600; margin-right: .5rem; }
    input { padding: .4rem; width: 220px; max-width: 100%; }
    button { padding: .4rem .9rem; cursor: pointer; }
    :focus-visible { outline: 3px solid #b45309; outline-offset: 2px; }
    .status { margin-left: .75rem; font-size: .9rem; }
    .ok { color: #1a7f37; }
    .fail { color: #c62828; }
    pre { background: #f5f5f5; padding: .75rem; border-radius: 6px; max-height: 300px; overflow: auto; font-size: .85rem; }
  </style>
</head>
<body>
  <main>
  <h1>Adoptions API Tester</h1>
  <p>Tests each route with <code>fetch</code>. If the API is on another domain or port, change the base URL.</p>

  <label for="base">API base URL</label><input id="base" type="url" value="http://localhost:3000">
  <button id="runAll" type="button">Run all tests</button>

  <fieldset>
    <legend>1. GET /api/adoptions (all, sorted by date)</legend>
    <button type="button" data-test="all">Test</button><span class="status" id="status-all" role="status"></span>
    <pre id="out-all" role="region" tabindex="0" aria-label="Response for all adoptions"></pre>
  </fieldset>

  <fieldset>
    <legend>2. GET /api/adoptions/:id</legend>
    <label for="adoptionId">Adoption ID</label><input id="adoptionId" inputmode="numeric" value="14">
    <button type="button" data-test="one">Test</button><span class="status" id="status-one" role="status"></span>
    <pre id="out-one" role="region" tabindex="0" aria-label="Response for one adoption"></pre>
  </fieldset>

  <fieldset>
    <legend>3. GET /api/adoptions/university/:id</legend>
    <label for="universityId">University ID</label><input id="universityId" inputmode="numeric" value="100724">
    <button type="button" data-test="uni">Test</button><span class="status" id="status-uni" role="status"></span>
    <pre id="out-uni" role="region" tabindex="0" aria-label="Response for university adoptions"></pre>
  </fieldset>
  </main>

  <script>
    const DATE_FIELD = 'AdoptionDate'; // keep in sync with server.js

    const base = () => document.getElementById('base').value.replace(/\/$/, '');

    // Each test: which URL to fetch, and a check that the JSON came back correctly
    const tests = {
      all: {
        url: () => `${base()}/api/adoptions`,
        check: (data) => {
          if (!Array.isArray(data)) return 'Expected an array';
          for (let i = 1; i < data.length; i++) {
            if (new Date(data[i - 1][DATE_FIELD]) > new Date(data[i][DATE_FIELD])) {
              return `Not sorted by ${DATE_FIELD} at index ${i}`;
            }
          }
          return `${data.length} adoptions, sorted by ${DATE_FIELD}`;
        }
      },
      one: {
        url: () => `${base()}/api/adoptions/${encodeURIComponent(document.getElementById('adoptionId').value)}`,
        check: (data) => {
          const id = document.getElementById('adoptionId').value;
          if (Array.isArray(data)) return 'Expected a single object';
          return String(data.AdoptionID) === id ? `Found AdoptionID ${id}` : 'AdoptionID does not match';
        }
      },
      uni: {
        url: () => `${base()}/api/adoptions/university/${encodeURIComponent(document.getElementById('universityId').value)}`,
        check: (data) => {
          const id = document.getElementById('universityId').value;
          if (!Array.isArray(data)) return 'Expected an array';
          const wrong = data.filter(a => String(a.UniversityID) !== id);
          return wrong.length ? `${wrong.length} results have the wrong UniversityID`
                              : `${data.length} adoptions for UniversityID ${id}`;
        }
      }
    };

    async function runTest(name) {
      const status = document.getElementById(`status-${name}`);
      const out = document.getElementById(`out-${name}`);
      const url = tests[name].url();
      status.textContent = 'Loading…';
      status.className = 'status';
      try {
        const response = await fetch(url);
        const data = await response.json();
        out.textContent = `GET ${url}  ->  ${response.status}\n\n` + JSON.stringify(data, null, 2);
        if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);
        const result = tests[name].check(data);
        const passed = /^(\d+ adoptions|Found)/.test(result);
        status.textContent = (passed ? 'PASS: ' : 'FAIL: ') + result;
        status.className = 'status ' + (passed ? 'ok' : 'fail');
      } catch (err) {
        status.textContent = 'FAIL: ' + err.message;
        status.className = 'status fail';
      }
    }

    document.querySelectorAll('button[data-test]').forEach(btn =>
      btn.addEventListener('click', () => runTest(btn.dataset.test)));

    document.getElementById('runAll').addEventListener('click', () =>
      Object.keys(tests).forEach(runTest));
  </script>
</body>
</html>
